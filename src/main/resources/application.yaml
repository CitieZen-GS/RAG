spring:
  application:
    name: RAG

  # Docker Compose de desenvolvimento (Oracle e RabbitMQ), guardado na pasta dockerfiles/.
  # Caminho relativo à pasta onde a aplicação é iniciada (a raiz do projeto).
  docker:
    compose:
      file: dockerfiles/compose.yaml

  # Banco e RabbitMQ vêm do dockerfiles/compose.yaml (spring-boot-docker-compose), igual às outras APIs.
  # Fora do Docker Compose, use as variáveis SPRING_DATASOURCE_* e SPRING_RABBITMQ_* (ver CLAUDE.md).

  # Flyway: migrations com o padrão M_RAG_VXX__descricao.sql
  # Histórico próprio para não misturar com o das outras APIs.
  # baseline-version 0: no schema já existente, aplica a partir da M_RAG_V01.
  flyway:
    locations: classpath:db/migration
    sql-migration-prefix: M_RAG_V
    table: flyway_historico_rag
    baseline-on-migrate: true
    baseline-version: 0

  # RabbitMQ: endereço vem do dockerfiles/compose.yaml (local) ou de SPRING_RABBITMQ_* (nuvem).
  # Consumidores: 3 tentativas com intervalo de 1s; depois a mensagem vai para a fila .dlq.
  rabbitmq:
    # Timeout curto: se o RabbitMQ cair, o pedido de relatório não fica travado esperando a conexão.
    connection-timeout: 5s
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

  # O schema é gerenciado só pelo Flyway: o Hibernate não cria nem altera tabelas
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  # Chave da OpenAI. O valor padrão só deixa a aplicação subir sem a chave (as chamadas à IA falham).
  # Defina sempre a variável de ambiente OPENAI_API_KEY (secreta).
  ai:
    openai:
      api-key: "${OPENAI_API_KEY:chave-nao-configurada}"
      chat:
        # Modelo da OpenAI. Padrão do Spring AI 2.0: gpt-5-mini (bom custo para chat e relatórios).
        model: "${OPENAI_MODELO:gpt-5-mini}"

# Regras do RAG (ver PropriedadesRag)
rag:
  fuso-horario: America/Sao_Paulo   # "hoje"/"ontem" no horário do Brasil (o Azure roda em UTC)
  periodo-padrao-dias: 7            # pergunta sem período: últimos 7 dias
  periodo-maximo-dias: 90           # maior período por pergunta ou relatório
  historico-mensagens: 10           # mensagens anteriores enviadas à IA como memória
  limite-registros: 400             # máximo de registros da linha do tempo por chamada

# Porta fixa da API de RAG (padrão de portas no CLAUDE.md)
server:
  port: 8082

# JWT: mesmo segredo das outras APIs (HS256, mínimo 32 caracteres).
# Em produção, defina a variável de ambiente JWT_SEGREDO.
jwt:
  segredo: "${JWT_SEGREDO:ajudante-familiar-segredo-dev-troque-em-producao}"

# Swagger / OpenAPI (springdoc): http://localhost:8082/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
